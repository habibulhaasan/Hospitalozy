<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Tech Pillar Gradient (Blue) -->
    <linearGradient id="techBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Health Pillar Gradient (Green) -->
    <linearGradient id="healthGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Bridge Gradient (Blue to Green) -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Soft Drop Shadow for 3D SaaS aesthetic -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- BACKGROUND: Transparent by default for versatility -->
  <rect width="800" height="200" fill="transparent"/>

  <!-- ICON GROUP -->
  <g id="Hospitalozy-Icon">
    <!-- Pulsing/Aura Background Circles representing SaaS cloud/network -->
    <circle cx="90" cy="100" r="75" fill="#F0F9FF"/>
    <circle cx="90" cy="100" r="55" fill="#E0F2FE"/>
    
    <!-- Decorative Data Nodes -->
    <circle cx="150" cy="45" r="6" fill="#10B981" opacity="0.8"/>
    <circle cx="35" cy="155" r="4" fill="#3B82F6" opacity="0.8"/>
    <circle cx="160" cy="140" r="8" fill="#0EA5E9" opacity="0.4"/>

    <!-- 
      The core icon forms both an 'H' for Hospitalozy and a Medical Cross (+).
      It consists of interlocking rounded capsules.
    -->
    <g filter="url(#softShadow)">
      <!-- Left Vertical (Tech/Management Pillar) -->
      <rect x="50" y="45" width="26" height="110" rx="13" fill="url(#techBlue)"/>
      
      <!-- Right Vertical (Health/Care Pillar) -->
      <rect x="104" y="45" width="26" height="110" rx="13" fill="url(#healthGreen)"/>
      
      <!-- Center Horizontal (The SaaS Bridge) -->
      <rect x="30" y="87" width="120" height="26" rx="13" fill="url(#bridgeGrad)"/>
    </g>
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <g id="Hospitalozy-Text" transform="translate(200, 0)">
    <!-- Main Brand Name -->
    <text x="0" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#1E293B" letter-spacing="-1">
      Hospital<tspan fill="#10B981">ozy</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <!-- <text x="6" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#64748B" letter-spacing="4.5">
      CLINIC MANAGEMENT SAAS
    </text> -->
  </g>
</svg>
